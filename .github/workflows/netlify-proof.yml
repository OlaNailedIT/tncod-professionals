name: netlify-proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/netlify-proof.yml'
      - 'netlify.toml'
      - 'netlify/**'
      - 'prisma/schema.prisma'
      - 'src/lib/env/deployment*'
      - 'src/lib/maintenance/**'
      - 'src/app/design-system/page.tsx'
      - 'package*.json'
      - 'next.config.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Netlify isolated packaging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Loopback/synthetic values only. This job never deploys or reads secrets.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_only_placeholder
      SUPABASE_AUTH_SERVER_ONLY: '1'
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'
      NETLIFY_AUTH_TOKEN: ''
      NETLIFY_SITE_ID: ''
      CONTEXT: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Build through Netlify without account access or deployment
        run: npx --yes --package=netlify-cli@27.16.1 -- netlify build --offline
      - name: Inspect generated function and engine artifacts
        run: |
          set -euo pipefail
          test -f node_modules/.prisma/client/libquery_engine-rhel-openssl-3.0.x.so.node
          test -f .netlify/functions/registration-cleanup.zip
          unzip -Z1 .netlify/functions/___netlify-server-handler.zip > /tmp/tncod-netlify-server-files.txt
          grep -F 'libquery_engine-rhel-openssl-3.0.x.so.node' /tmp/tncod-netlify-server-files.txt
          find .netlify -type f \( -name '*.zip' -o -name '*rhel-openssl-3.0.x*' -o -name '*manifest*.json' \) -print
      - name: Verify built production HTTP boundaries
        run: |
          set -euo pipefail
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3100 > /tmp/tncod-next-proof.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3100/ > /tmp/tncod-home-proof.html; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          grep -Fq 'TNCOD Professionals' /tmp/tncod-home-proof.html
          lab_status=$(curl --silent --show-error --output /tmp/tncod-lab-proof.html --write-out '%{http_code}' http://127.0.0.1:3100/design-system)
          test "$lab_status" = 404
          grep -Fq 'This page could not be found' /tmp/tncod-lab-proof.html
          cleanup_status=$(curl --silent --show-error --output /tmp/tncod-cleanup-proof.json --write-out '%{http_code}' http://127.0.0.1:3100/api/internal/registration-cleanup)
          test "$cleanup_status" = 401
          grep -Fq '"ok":false' /tmp/tncod-cleanup-proof.json
          echo 'Built HTTP boundaries verified: homepage 200, laboratory 404, unauthenticated maintenance 401'
